# Version catalog for the Android client (ADR 0009).
#
# Pinned to the versions this module was scaffolded against:
#   AGP 9.4.1  → requires Gradle >= 9.6.0
#   Gradle 9.8.1 runs on JDK 25 (repo-wide JDK), min JDK for Gradle is 17
#   Compose BOM 2026.09.00 → requires compileSdk 37 + AGP 9
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
credentials = "1.6.0"
googleid = "1.2.1"
webkit = "1.17.1"
okhttp = "5.5.0"
serializationJson = "1.11.0"
coroutines = "1.11.0"

# Test-only. MockWebServer is the OkHttp project's own test double, so
# it tracks the client version exactly.
junit = "4.13.2"
mockwebserver = "5.5.0"
coroutinesTest = "1.11.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose (UI only — the SPA lives in the WebView).
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Google Sign-In via Credential Manager — replaces the deprecated
# Google Sign-In button API. Returns a raw id_token JWT, which is
# exactly what the BFF's POST /api/auth/google verifies.
#
# `GetGoogleIdOption` / `GoogleIdTokenCredential` live in the separate
# `googleid` artifact, NOT in `credentials-play-services-auth` (which
# only ships the provider controllers).
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# WebView document-start script injection (sessionStorage seeding before
# the SPA's own JS runs) + modern WebView feature detection.
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }

# Session JWT at rest: an AndroidKeyStore AES-256-GCM key plus an
# app-private file (see auth/SessionStore). No androidx.security.crypto —
# that artifact is in maintenance and MasterKey / EncryptedSharedPreferences
# are deprecated in 1.1.0.

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }