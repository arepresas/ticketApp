# fly.toml — Backend-for-frontend (Spring Boot) on Fly.io.
#
# One-time setup (needs a logged-in `flyctl`, NOT part of CI):
#   fly apps create ticketapp-bff
#   fly pg create --name ticketapp-db --region ams
#   fly secrets set -a ticketapp-bff \
#       DB_URL='jdbc:postgresql://<host>:5432/<db>' \
#       DB_USER='<user>' DB_PASSWORD='<pass>' \
#       GOOGLE_CLIENT_ID='<...>.apps.googleusercontent.com' \
#       BFF_JWT_SECRET="$(openssl rand -base64 32)" \
#       OPENAI_API_KEY='<provider-api-key>'
# Deploys afterwards run from CI (.github/workflows/fly-deploy.yml).

app = 'ticketapp-bff'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Heap sized for a 1gb shared VM (leaves room for Metaspace + PDFBox buffers).
  # NOTE: JAVA_TOOL_OPTIONS (not JAVA_OPTS) — the distroless runtime has no
  # shell, so the exec-form ENTRYPOINT never expands $JAVA_OPTS. The JVM picks
  # JAVA_TOOL_OPTIONS up automatically.
  JAVA_TOOL_OPTIONS = '-Xmx768m'
  TICKETAPP_AI_ENABLED = 'true'
  TICKETAPP_AI_CRON = '0 */15 * * * *'
  TICKETAPP_AI_BATCH_SIZE = '5'
  TICKETAPP_AI_RETRY_ATTEMPTS = '2'
  # Any OpenAI-compatible endpoint. Kept here (not defaulted in
  # the module) so this deployment names its provider explicitly;
  # the key stays a secret.
  OPENAI_BASE_URL = 'https://api.openai.com/v1'
  OPENAI_MODEL = 'gpt-4o-mini'
  OPENAI_TIMEOUT_MS = '30000'
  OPENAI_TEMPERATURE = '0.0'
  OPENAI_MAX_COMPLETION_TOKENS = '16384'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  # Cold start measured ~350s on 1gb shared (Liquibase 20 sets + slow bean
  # init). Grace is capped at 60s by the platform (higher values are lowered
  # with a warning), so this only buys the max — slow boot itself must be
  # fixed separately (2026-09-28 incident). Pair with --wait-timeout on deploy.
  [[http_service.checks]]
    grace_period = '60s'
    interval = '15s'
    method = 'GET'
    path = '/actuator/health'
    protocol = 'http'
    timeout = '5s'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
