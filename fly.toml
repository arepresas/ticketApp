# fly.toml app configuration file generated for ticketapp-bff on 2026-09-28T11:34:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ticketapp-bff'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  JAVA_OPTS = '-Xmx768m'
  MINIMAX_BASE_URL = 'https://api.minimax.io/v1'
  MINIMAX_MAX_COMPLETION_TOKENS = '16384'
  MINIMAX_MODEL = 'MiniMax-M3'
  MINIMAX_TEMPERATURE = '0.0'
  MINIMAX_TIMEOUT_MS = '30000'
  TICKETAPP_AI_BATCH_SIZE = '5'
  TICKETAPP_AI_CRON = '0 */15 * * * *'
  TICKETAPP_AI_ENABLED = 'true'
  TICKETAPP_AI_RETRY_ATTEMPTS = '2'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/actuator/health'
    protocol = 'http'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
