server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: ticketapp-bff
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      # Ticket uploads are capped client-side at 10 MB; raise the Tomcat
      # ceiling slightly to leave headroom for multipart envelope overhead.
      max-file-size: 11MB
      max-request-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Never in a deployed environment. The health chain is
      # permitAll with no resource server, so no principal is ever
      # "authorized" here — when-authorized was dead config.
      # application-local.yml re-enables it for debugging.
      show-details: never

logging:
  level:
    root: INFO
    # DEBUG for com.ticketapp lives in application-local.yml only:
    # at this level the pipeline logs ticket ids and provider text,
    # which has no business in a deployed log.

google:
  # OAuth 2.0 Web client id (matches front VITE_GOOGLE_CLIENT_ID).
  client-id: ${GOOGLE_CLIENT_ID}

bff:
  jwt:
    # HS256 secret. Set BFF_JWT_SECRET to a value generated with
    # `openssl rand -base64 32` (must be ≥ 32 chars; the application
    # refuses to start otherwise — see security.md §Auth-specific).
    secret: ${BFF_JWT_SECRET}
    ttl-hours: 24

ticketapp:
  ai:
    # Operator layer supplies every key under
    # `ticketapp.ai.{provider}.*` and the provider-agnostic keys
    # (`enabled`, `cron`, `batch-size`, `retry-attempts`).
    # application-local.yml supplies the local-dev defaults;
    # application-test.yml supplies test-context defaults; and in
    # production all of these come from the deploy environment.
    # No fallbacks here on purpose — see ADR 0007 D3 (provider
    # selection happens via the classpath, not via this file).
    enabled: ${TICKETAPP_AI_ENABLED}
    cron: ${TICKETAPP_AI_CRON}
    batch-size: ${TICKETAPP_AI_BATCH_SIZE}
    retry-attempts: ${TICKETAPP_AI_RETRY_ATTEMPTS}
    openai:
      base-url: ${OPENAI_BASE_URL}
      model: ${OPENAI_MODEL}
      timeout-ms: ${OPENAI_TIMEOUT_MS}
      temperature: ${OPENAI_TEMPERATURE}
      max-completion-tokens: ${OPENAI_MAX_COMPLETION_TOKENS}
      api-key: ${OPENAI_API_KEY}
      # Extra headers attached to every provider request. Comma-separated
      # `key=value` pairs, e.g. `X-OpenCode-Session=ses-1234,X-Org-Id=org-1`.
      # Empty by default — most providers don't. Required by some gateways
      # that route on a session or tenant header (opencode-go, etc.).
      # Values are not logged; treat them like credentials.
      custom-headers: ${OPENAI_HEADERS:}
      # Opt-in SDK HTTP debug logging. Toggles the OpenAI SDK's own
      # logLevel(LogLevel.DEBUG) so request/response lines are emitted
      # via SLF4J. Off by default; flip to `true` when a gateway rejects
      # with an empty body and you need to see the wire shape.
      debug-http: ${OPENAI_DEBUG_HTTP:false}