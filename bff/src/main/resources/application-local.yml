# Local profile — operator-layer override for local development.
#
# Activate with: `mvn -pl bff spring-boot:run
#   -Dspring-boot.run.profiles=local`
#
# This file supplies values for the operator-layer contract documented
# at the bottom of `application.yml`. By project convention no
# defaults live here either: every key either is supplied literally
# below or comes from the environment / `.env`.
#
# `spring.config.import: optional:file:.env[.properties]` loads the
# project-root `.env` so docker-compose-style exports (DB_URL,
# OPENAI_*, BFF_JWT_SECRET, GOOGLE_CLIENT_ID) flow through. The
# `optional:` prefix means a missing `.env` is fine — the local
# literals below cover the rest.
#
# Anything that has a real value in `.env` MUST NOT be repeated
# here, because a YAML literal would win over the .env-imported
# placeholder. The provider api-key / base-url / model / timeout are
# loaded from `.env`; this profile only configures the local-dev
# database coordinates and the BFF scheduler knobs.

spring:
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://localhost:6432/ticketAppDb
    username: ticketAppUser
    password: ticketAppPass

# Local-dev JWT secret. Production must set BFF_JWT_SECRET to a
# ≥ 32-char value (see security.md §Auth-specific). Local uses a
# deterministic placeholder so the dev can sign in without generating
# a real secret.
bff:
  jwt:
    secret: dev-only-placeholder-secret-change-me-please-32

ticketapp:
  ai:
    enabled: true
    cron: "*/10 * * * * *"
    batch-size: 5
    retry-attempts: 2
    openai:
      # Base URL and model default to OpenAI's own endpoint. Local
      # dev can boot without `.env`; just override via `.env` or the
      # shell to point at a different provider. The local key still
      # has no default — a missing API key is a fast-fail at boot.
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model:    ${OPENAI_MODEL:gpt-4o-mini}
      # Two-minute request budget. Multimodal extraction with images
      # takes 10-30 s on a multimodal model; 3 s was too tight and
      # caused OpenAIIoException("Request failed") on every ticket.
      # Tunable via .env; the default keeps local dev working.
      timeout-ms: ${OPENAI_TIMEOUT_MS:120000}
      # Deterministic JSON: 0.0 so retries return the same text.
      temperature: 0.0
      # Extraction budget: covers the worst observed case (Lidl, 7+
      # products with loyalty discounts, 2026-07-13).
      max-completion-tokens: ${OPENAI_MAX_COMPLETION_TOKENS:16384}
      # OCR budget, deliberately larger. Hybrid-reasoning models bill
      # reasoning INSIDE max_completion_tokens, so an OCR call that
      # deliberates can consume the whole budget and return an empty
      # content (2026-10-18: 16383/16384 reasoning tokens,
      # finish_reason=length, no transcript). 65536 leaves room for a
      # long reasoning pass plus a 30-line receipt. Provider cap is
      # 524288; tune down if your model bills reasoning expensively.
      ocr-max-completion-tokens: ${OPENAI_OCR_MAX_COMPLETION_TOKENS:65536}
      # Reasoning effort. Providers default hybrid-reasoning models to
      # their HIGHEST tier, which is what makes the overrun above
      # likely. `low` is the right tier for transcription + a fixed
      # JSON schema. `none` is rejected at boot (MiniMax answers 400).
      reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
      # No custom headers by default — most local providers don't need any.
      # Set in `.env` if your gateway requires a routing/session header.
      custom-headers: ${OPENAI_HEADERS:}
      debug-http: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ticketapp: DEBUG
    com.openai: DEBUG
