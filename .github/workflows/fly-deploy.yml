name: Fly Deploy

# Deploys BFF + frontend to Fly.io on every main push.
# One-time setup (run locally, NOT in CI):
#   fly auth login
#   fly apps create ticketapp-bff
#   fly apps create ticketapp-front
#   fly pg create --name ticketapp-db --region ams
#   fly secrets set -a ticketapp-bff DB_URL=... DB_USER=... DB_PASSWORD=... \
#     GOOGLE_CLIENT_ID=... BFF_JWT_SECRET=... MINIMAX_API_KEY=...
# Needs the FLY_API_TOKEN repo secret (fly auth token).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-bff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # master @ 2026-09-27
      - run: flyctl deploy --remote-only --config fly.toml --dockerfile Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # master @ 2026-09-27
      - run: >-
          flyctl deploy --remote-only
          --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        working-directory: front
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
